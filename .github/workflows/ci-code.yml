name: CI - Code

on:
  push:
    branches: [develop, test, main]
    paths:
      - 'src/**'
      - '.github/workflows/ci-code.yml'
      - '.github/workflows/ci-code-reusable.yml'

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test code
    uses: ./.github/workflows/ci-code-reusable.yml
