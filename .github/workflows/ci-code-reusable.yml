name: CI - Code validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # Worker SDK builds its generated extensions project for .NET 8.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test
        run: dotnet test src/HelloFunction.Tests/HelloFunction.Tests.csproj --configuration Release
      - name: Publish deployment package
        run: |
          dotnet publish src/HelloFunction/HelloFunction.csproj --configuration Release --output "$RUNNER_TEMP/function"
          cd "$RUNNER_TEMP/function"
          zip -qr "$RUNNER_TEMP/function.zip" .
      - name: Upload deployment package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: function-package
          path: ${{ runner.temp }}/function.zip
          if-no-files-found: error
